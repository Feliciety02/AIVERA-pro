<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIVERA — Intelligent Web Security Assessment & Vulnerability Management Platform (demo frontend)" />
    <meta name="color-scheme" content="light dark" />
    <title>AIVERA — Intelligent Security. Verified Decisions.</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem("aegis-demo-state");
          var parsed = raw ? JSON.parse(raw) : null;
          // Pre-v4 data defaulted to dark; the redesign defaults to light.
          var theme = parsed && parsed.version >= 4 ? ((parsed.state || {}).settings || {}).appearance?.theme : "light";
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
